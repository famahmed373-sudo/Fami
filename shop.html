<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FAMI — Shop</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/src/runtime-shims.js" defer></script>
  <script src="/src/supabase-client.js" defer></script>
  <script src="/src/db-wrapper.js" defer></script>
</head>
<body>
  <nav><a href="/shops.html">Shops</a> | <a href="/add-shop.html">Add Shop</a> | <a href="/login.html">Home</a></nav>
  <main>
    <h1 id="title">Shop</h1>
    <div id="details"></div>
    <h2>Payments</h2>
    <div id="payments"></div>
    <h3>Add Payment</h3>
    <form id="payForm">
      <label>Amount: <input name="amount" type="number" required></label><br>
      <label>Date: <input name="date" type="date"></label><br>
      <button type="submit">Add Payment</button>
    </form>
  </main>
  <script>
    (function(){
      function q(name){ const params = new URLSearchParams(location.search); return params.get(name); }
      const shopId = q('id');
      function readDemo(){ try{ return JSON.parse(localStorage.getItem('FAMI_DEMO_DATA')||'{"shops":[],"payments":[]}'); }catch(e){return {shops:[],payments:[]};} }
      function writeDemo(data){ localStorage.setItem('FAMI_DEMO_DATA', JSON.stringify(data)); }
      async function load(){
        const data = readDemo(); const shops = data.shops||[]; const payments = data.payments||[];
        const shop = shops.find(s=>String(s.id)===String(shopId));
        if(!shop){ document.getElementById('title').textContent='Shop not found'; return; }
        document.getElementById('title').textContent = 'Payments for: '+shop.name;
        document.getElementById('details').textContent = 'Rent: '+(shop.rent||0);
        const list = document.getElementById('payments'); list.innerHTML='';
        const shopPayments = payments.filter(p=>String(p.shop_id)===String(shopId));
        if(!shopPayments.length) list.textContent='No payments yet';
        shopPayments.forEach(p=>{ const d = document.createElement('div'); d.textContent = `#${p.id} — ${p.amount} on ${p.date}`; list.appendChild(d); });
      }
      document.getElementById('payForm').addEventListener('submit', async function(e){
        e.preventDefault(); const a = Number(e.target.amount.value); const d = e.target.date.value || new Date().toISOString().slice(0,10);
        if(!a) return alert('Provide amount');
        const newP = { id: 'p_'+Date.now(), shop_id: shopId, amount: a, date: d };
        try{ const client = window.db || window.supabase; if(client && client.from){ await client.from('payments').insert(newP); } }catch(err){console.warn(err)}
        const data = readDemo(); data.payments = (data.payments||[]).concat(newP); writeDemo(data);
        load();
      });
      load();
    })();
  </script>
</body>
</html>
